<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="body" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="55%" stop-color="#e0a82e"/>
      <stop offset="100%" stop-color="#7a5208"/>
    </radialGradient>
    <radialGradient id="hole" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#7a5208" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7a5208" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <mask id="cut">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="256" cy="256" r="46" fill="#000"/>
    </mask>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="210" fill="url(#body)" mask="url(#cut)"/>
  </g>
  <circle cx="256" cy="256" r="62" fill="url(#hole)" mask="url(#cut)"/>
  <circle cx="256" cy="256" r="46" fill="none" stroke="#7a5208" stroke-width="4" opacity="0.55"/>
  <ellipse cx="180" cy="150" rx="70" ry="38" fill="#fff" opacity="0.75" transform="rotate(-35 180 150)" filter="url(#blur)"/>
  <ellipse cx="330" cy="380" rx="60" ry="22" fill="#fff" opacity="0.18" transform="rotate(-35 330 380)" filter="url(#blur)"/>
</svg>
